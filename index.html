<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transcend Frontiers</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0a0a0a;
      color: #f5f5f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 24px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1d1d1f;
    }

    header .logo {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f5f5f7;
      text-decoration: none;
    }

    header nav a {
      color: #a1a1a6;
      text-decoration: none;
      font-size: 14px;
      margin-left: 32px;
      transition: color 0.2s;
    }

    header nav a:hover { color: #f5f5f7; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 24px;
    }

    .hero-label {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #6e6e73;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 700;
      letter-spacing: -2px;
      line-height: 1.05;
      background: linear-gradient(135deg, #f5f5f7 0%, #a1a1a6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 24px;
    }

    .tagline {
      font-size: clamp(16px, 2.5vw, 22px);
      color: #6e6e73;
      max-width: 560px;
      line-height: 1.6;
      margin-bottom: 48px;
    }

    .cta {
      display: inline-block;
      background: #f5f5f7;
      color: #0a0a0a;
      padding: 14px 32px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .cta:hover { opacity: 0.85; }

    footer {
      padding: 32px 48px;
      border-top: 1px solid #1d1d1f;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    footer p {
      font-size: 13px;
      color: #6e6e73;
    }

    footer nav a {
      color: #6e6e73;
      text-decoration: none;
      font-size: 13px;
      margin-left: 24px;
      transition: color 0.2s;
    }

    footer nav a:first-child { margin-left: 0; }
    footer nav a:hover { color: #a1a1a6; }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">Transcend Frontiers</a>
    <nav>
      <a href="support.html">Support</a>
      <a href="privacy.html">Privacy</a>
    </nav>
  </header>

  <main>
    <p class="hero-label">Welcome</p>
    <h1>Transcend Frontiers</h1>
    <p class="tagline">Pushing the boundaries of what's possible. Built for those who dare to go further.</p>
    <a class="cta" href="support.html">Get in Touch</a>
  </main>

  <footer>
    <p>&copy; 2026 Transcend Frontiers. All rights reserved.</p>
    <nav>
      <a href="privacy.html">Privacy Policy</a>
      <a href="support.html">Support</a>
    </nav>
  </footer>

</body>
</html>
